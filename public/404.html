<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <meta name="description" content="The page you're looking for doesn't exist." />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        color: #2b2b33;
        background:
          radial-gradient(1200px 600px at 80% -10%, #f6e9ff 0%, transparent 60%),
          radial-gradient(900px 500px at -10% 110%, #e6f0ff 0%, transparent 60%),
          linear-gradient(180deg, #fbf9ff 0%, #f4f6fb 100%);
        display: grid;
        place-items: center;
        padding: 2rem;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 520px;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 24px;
        padding: 3rem 2.25rem;
        box-shadow: 0 20px 60px -20px rgba(80, 70, 130, 0.18);
        animation: rise 0.6s ease-out both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7a6cab;
        background: rgba(122, 108, 171, 0.1);
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: clamp(3rem, 8vw, 4.5rem);
        margin: 0 0 0.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #6c5ce7, #d96c9d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h2 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
        font-weight: 500;
      }
      p {
        margin: 0 0 2rem;
        color: #5b5b6b;
        line-height: 1.6;
      }
      a.home {
        display: inline-block;
        text-decoration: none;
        color: #fff;
        background: linear-gradient(135deg, #6c5ce7, #d96c9d);
        padding: 0.85rem 1.6rem;
        border-radius: 999px;
        font-weight: 500;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 10px 24px -10px rgba(108, 92, 231, 0.6);
      }
      a.home:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(108, 92, 231, 0.7); }
      a.home:active { transform: translateY(0); }
      footer { margin-top: 1.5rem; font-size: 0.85rem; color: #8a8a99; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Error 404</span>
      <h1>404</h1>
      <h2>This page wandered off</h2>
      <p>The page you're looking for doesn't exist or has been moved. Let's get you back to somewhere familiar.</p>
      <a class="home" href="/">← Back to homepage</a>
      <footer>Thanks for stopping by</footer>
    </main>
  </body>
</html>
